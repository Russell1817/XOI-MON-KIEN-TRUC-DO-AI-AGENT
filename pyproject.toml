[project]
name = "aierosion"
version = "0.1.0"
description = "Measuring architecture erosion introduced by AI coding agent pull requests (AIDev dataset)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "huggingface_hub",
    "pydriller",
    "networkx",
    "scipy",
    "scikit-posthocs",
    "matplotlib",
    "requests",
    "pyyaml",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pymupdf>=2.0",
    "pytest",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aierosion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
