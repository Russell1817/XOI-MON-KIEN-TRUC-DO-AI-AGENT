[project]
name = "aierosion"
version = "0.1.0"
description = "Signs of architecture erosion in pull requests of AI coding agents: measurement pipeline on the AIDev dataset"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "pyarrow",
    "huggingface_hub",
    "networkx",
    "scipy",
    "scikit-posthocs",
    "statsmodels",
    "matplotlib",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aierosion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
